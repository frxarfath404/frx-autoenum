<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1524"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f5f"/>
      <stop offset="0.3" stop-color="#ffb454"/>
      <stop offset="0.6" stop-color="#4de1c1"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f5f"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="460" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#3a2a1b" stroke-width="1" opacity="0.3">
    <g>
      <line x1="0" y1="58" x2="1280" y2="58"/><line x1="0" y1="116" x2="1280" y2="116"/>
      <line x1="0" y1="174" x2="1280" y2="174"/><line x1="0" y1="232" x2="1280" y2="232"/>
      <line x1="0" y1="290" x2="1280" y2="290"/><line x1="0" y1="348" x2="1280" y2="348"/>
      <line x1="0" y1="406" x2="1280" y2="406"/>
    </g>
    <g>
      <line x1="55" y1="0" x2="55" y2="460"/><line x1="165" y1="0" x2="165" y2="460"/>
      <line x1="275" y1="0" x2="275" y2="460"/><line x1="385" y1="0" x2="385" y2="460"/>
      <line x1="495" y1="0" x2="495" y2="460"/><line x1="605" y1="0" x2="605" y2="460"/>
      <line x1="715" y1="0" x2="715" y2="460"/><line x1="825" y1="0" x2="825" y2="460"/>
      <line x1="935" y1="0" x2="935" y2="460"/><line x1="1045" y1="0" x2="1045" y2="460"/>
      <line x1="1155" y1="0" x2="1155" y2="460"/>
    </g>
  </g>
  <!-- glow blobs -->
  <circle cx="110" cy="70" r="250" fill="#ff5f5f" opacity="0.07"/>
  <circle cx="1190" cy="40" r="270" fill="#4de1c1" opacity="0.06"/>

  <!-- radar / scan sweep mark -->
  <g transform="translate(95,118)" filter="url(#glow)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.9"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 0 L 0 -44 A 44 44 0 0 1 31 -31 Z" fill="#ff5f5f" opacity="0.18"/>
    <circle cx="0" cy="0" r="4" fill="#ffb454" stroke="none"/>
    <circle cx="18" cy="-12" r="2.5" fill="#4de1c1"/>
    <circle cx="-14" cy="20" r="2.5" fill="#5cc8ff"/>
  </g>

  <!-- title -->
  <text x="192" y="128" font-size="66" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="1">FRX-AUTOENUM</text>

  <!-- subtitle -->
  <text x="194" y="170" font-size="22" fill="#c4cdd9" letter-spacing="0.5">Advanced Auto-Enumeration &amp; Vulnerability Hunting Framework
  </text>
  <text x="194" y="200" font-size="16" fill="#5b6a7d" letter-spacing="0.5">full 65535 TCP + UDP  ·  NSE/CVE hunting  ·  parallel per-service enum  ·  exploit-suggest</text>

  <!-- author rainbow -->
  <text x="194" y="238" font-size="22" font-weight="700" letter-spacing="3">
    <tspan fill="#8492a4" font-weight="400">coded by  </tspan><tspan fill="#ff5f5f">f</tspan><tspan fill="#ffb454">r</tspan><tspan fill="#39ff9d">x</tspan><tspan> </tspan><tspan fill="#4de1c1">a</tspan><tspan fill="#5cc8ff">r</tspan><tspan fill="#ff6ac1">f</tspan><tspan fill="#ff5f5f">a</tspan><tspan fill="#ffb454">t</tspan><tspan fill="#39ff9d">h</tspan>
    <tspan fill="#3b5566" font-weight="400">    ·  github.com/frxarfath404</tspan>
  </text>

  <!-- terminal mock -->
  <g transform="translate(150,268)">
    <rect x="0" y="0" width="980" height="166" rx="10" fill="#0c1017" stroke="#23303e"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f56"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#27c93f"/>
    <text x="90" y="24" font-size="13" fill="#5b6a7d">frx_autoenum.py — live scan</text>
    <text x="20" y="58" font-size="15" fill="#e6edf5"><tspan fill="#8492a4">$</tspan> sudo python3 frx_autoenum.py -H <tspan fill="#ffb454">10.10.10.10</tspan></text>
    <text x="20" y="86" font-size="14"><tspan fill="#4de1c1" font-weight="700">[PHASE 1]</tspan><tspan fill="#c4cdd9">  Full TCP Port Discovery  </tspan><tspan fill="#27c93f">████████████░░░░</tspan><tspan fill="#c4cdd9"> 74.0%</tspan></text>
    <text x="20" y="110" font-size="14"><tspan fill="#39ff9d" font-weight="700">[+]</tspan><tspan fill="#c4cdd9"> 6 open TCP ports discovered — 22, 80, 139, 445, 3389, 5985</tspan></text>
    <text x="20" y="134" font-size="14"><tspan fill="#ff5f5f" font-weight="700">[!!]</tspan><tspan fill="#ff9d9d"> SMB — null session share listing succeeded!</tspan></text>
    <text x="20" y="158" font-size="14"><tspan fill="#ffb454" font-weight="700">[!]</tspan><tspan fill="#f5d9a8"> CVE-2019-0708 possible BlueKeep — verify manually</tspan></text>
  </g>

  <!-- module chips -->
  <g font-size="14" font-weight="600">
    <g transform="translate(1140,278)">
      <rect x="-1" y="0" width="120" height="25" rx="13" fill="#10261f" stroke="#1f5e4a"/><text x="14" y="17" fill="#4de1c1">HTTP·TLS</text>
      <rect x="-1" y="32" width="120" height="25" rx="13" fill="#0f1f2e" stroke="#1f5e7a"/><text x="20" y="49" fill="#5cc8ff">SMB</text>
      <rect x="-1" y="64" width="120" height="25" rx="13" fill="#241023" stroke="#5e1f4a"/><text x="10" y="81" fill="#ff6ac1">KERBEROS</text>
      <rect x="-1" y="96" width="120" height="25" rx="13" fill="#26210f" stroke="#5e4a1f"/><text x="12" y="113" fill="#ffb454">RDP·WINRM</text>
      <rect x="-1" y="128" width="120" height="25" rx="13" fill="#2a1414" stroke="#6e2a2a"/><text x="10" y="145" fill="#ff8a6a">CVE HUNT</text>
    </g>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="454" width="1280" height="6" fill="url(#accent)"/>
</svg>
